    <!-- Inline so the ground is black on the very first paint, before the
         stylesheet resolves. A dark site has no excuse for a white flash. -->
    <style>
      html,
      body {
        margin: 0;
        background: #080808;
      }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abhishek — one surface" />
    <meta
      property="og:description"
      content="No pages. One infinite plane where zoom level is information depth."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Silkscreen&display=swap"
      rel="stylesheet"
    />

    <!-- The display face is self-hosted, so preload it rather than waiting for
         the stylesheet to be parsed before the browser finds it. -->
    <link rel="preload" href="/fonts/CandyInc.woff" as="font" type="font/woff" crossorigin />
